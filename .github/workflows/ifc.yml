name: Validar IFC
on:
  push:
    paths: ['app/tests/ifc/**', 'app/tests/validar_ifc.py', '.github/workflows/ifc.yml']
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ifcopenshell
      - run: python app/tests/validar_ifc.py app/tests/ifc/*.ifc
