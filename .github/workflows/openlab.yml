# Datos públicos del puente openLAB (TU Dresden, Zenodo 10782663): exploración y extracción de ventanas de vibración + temperatura para probar PuenteGemelo.
name: Datos openLAB
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'explorar | extraer'
        default: 'explorar'
      dias:
        description: 'Archivos a extraer (separados por ;), solo en modo extraer'
        default: ''
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pandas requests scipy
      - name: Procesar
        env: { MODO: '${{ github.event.inputs.modo }}', DIAS: '${{ github.event.inputs.dias }}' }
        run: |
          mkdir -p out
          python - <<'PY'
          import os, json, requests, io, numpy as np, pandas as pd
          import traceback
          info = {}
          try:
            r0 = requests.get('https://zenodo.org/api/records/10782663', timeout=60); info['http'] = r0.status_code
            rec = r0.json() if r0.ok else {}
            if not rec.get('files'):
              q = requests.get('https://zenodo.org/api/records', params={'q': 'openLAB bridge', 'size': 10}, timeout=60).json()
              info['busqueda'] = [{'id': h['id'], 'titulo': h['metadata'].get('title'), 'doi': h.get('doi'), 'archivos': [(f['key'], f['size']) for f in h.get('files', [])][:12]} for h in q.get('hits', {}).get('hits', [])]
          except Exception as e:
            info['error_registro'] = traceback.format_exc(); rec = {}
          meta = rec.get('metadata', {}); files = rec.get('files', [])
          info.update({'titulo': meta.get('title'), 'licencia': (meta.get('license') or {}), 'doi': rec.get('doi'), 'creadores': [c.get('name') for c in meta.get('creators', [])],
                  'descripcion': (meta.get('description') or '')[:3000], 'archivos': [{'key': f['key'], 'size': f['size']} for f in files]})
          def get(key):
              f = next(f for f in files if f['key'] == key); r = requests.get(f['links']['self'], timeout=600); r.raise_for_status(); return r.content
          if os.environ['MODO'] == 'explorar' and files:
           try:
                csvs = [f for f in files if f['key'].lower().endswith('.csv')]
                if csvs:
                    k = sorted(csvs, key=lambda f: f['size'])[len(csvs)//2]['key']; raw = get(k); txt = raw[:4000].decode('latin1')
                    info['muestra'] = {'archivo': k, 'cabecera': txt.splitlines()[:12]}
                    df = pd.read_csv(io.BytesIO(raw), sep=None, engine='python', nrows=None)
                    info['muestra'].update({'filas': len(df), 'columnas': list(df.columns), 'describe': json.loads(df.describe().to_json())})
                    t = pd.to_datetime(df.iloc[:, 0], errors='coerce'); dt = t.diff().dt.total_seconds()
                    info['muestra']['dt'] = {'mediana': float(dt.median()), 'saltos>1s': int((dt > 1).sum()), 'inicio': str(t.iloc[0]), 'fin': str(t.iloc[-1])}
                    gaps = t[dt > 1]; info['muestra']['bloques'] = [str(x) for x in gaps.head(20)]
                else:
                    for f in files:
                        if f['size'] < 5e6 and not f['key'].endswith('.zip'): info.setdefault('textos', {})[f['key']] = get(f['key'])[:3000].decode('latin1', 'replace')
           except Exception:
            info['error_muestra'] = traceback.format_exc()
          if os.environ['MODO'] == 'extraer' and files:
            import urllib.request
            pdfs = [f for f in files if f['key'].lower().endswith('.pdf')]
            for f in pdfs:
              try: open('out/' + f['key'].replace(' ', '_'), 'wb').write(get(f['key']))
              except Exception: info.setdefault('errores', []).append(traceback.format_exc())
            info['ventanas'] = []
            for day in [d.strip() for d in os.environ['DIAS'].split(';') if d.strip()]:
              try:
                f = next(f for f in files if f['key'].startswith(day)); urllib.request.urlretrieve(f['links']['self'], 'dia.csv')
                cols = ['t', 'T', 'a1', 'a2', 'a3', 'a4']
                df = pd.read_csv('dia.csv', sep='\t', header=0, names=cols, dtype={'t': str}, encoding='latin1')
                t = pd.to_datetime(df['t'], format='%d.%m.%Y %H:%M:%S.%f', errors='coerce'); df['h'] = t.dt.hour
                hr = df.groupby('h')['T'].mean(); info.setdefault('temp_horaria', {})[day] = {int(k): round(float(v), 2) for k, v in hr.items()}
                n = len(df); fs = (n - 1) / max(1e-9, (t.iloc[-1] - t.iloc[0]).total_seconds())
                for etq, hh in [('fria', int(hr.idxmin())), ('calida', int(hr.idxmax()))]:
                  w = df[df['h'] == hh].iloc[:int(30 * 60 * fs)]
                  if len(w) < 1000: continue
                  tw = t[w.index]; gaps = int((tw.diff().dt.total_seconds() > 0.05).sum())
                  if gaps: info.setdefault('descartadas', []).append(f'{day} {hh}h: {gaps} huecos'); continue
                  from scipy.signal import decimate
                  X = w[['a1', 'a2', 'a3', 'a4']].to_numpy(float); X = X - X.mean(axis=0)
                  # filtro antialias FIR de fase cero y diezmado 200 → 100 Hz
                  Xd = decimate(X, 2, ftype='fir', axis=0, zero_phase=True); fsd = fs / 2
                  tt = np.arange(len(Xd)) / fsd; name = f'openlab_{day}_{etq}_{hh:02d}h.csv'
                  with open('out/' + name, 'w') as fo:
                    fo.write(f'# openLAB (TU Dresden), Zenodo 10782663, CC BY 4.0. Dia {day} hora {hh:02d}:00, 30 min, temperatura media {w["T"].mean():.2f} C, muestreo {fsd:.2f} Hz\n')
                    fo.write('tiempo_s,Acc01_Girder1Middle_mV,Acc02_Girder1Quarter_mV,Acc03_Girder2Middle_mV,Acc04_Girder2Quarter_mV\n')
                    np.savetxt(fo, np.column_stack([tt, Xd]), delimiter=',', fmt=['%.4f'] + ['%.4f'] * 4)
                  info['ventanas'].append({'archivo': name, 'dia': day, 'hora': hh, 'T_media': round(float(w['T'].mean()), 2), 'fs': round(fsd, 3), 'muestras': len(Xd), 'rms_mV': [round(float(v), 4) for v in X.std(axis=0)]})
                os.remove('dia.csv')
              except Exception: info.setdefault('errores', []).append(day + ': ' + traceback.format_exc()[-1500:])
          json.dump(info, open('out/openlab_info.json', 'w'), indent=1, ensure_ascii=False, default=str); print(json.dumps(info, indent=1, ensure_ascii=False, default=str)[:6000])
          PY
      - if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: datos-openlab
          name: Datos de prueba · puente openLAB (TU Dresden, Zenodo 10782663)
          prerelease: true
          make_latest: false
          body: Extractos del conjunto público openLAB para probar PuenteGemelo. Ver licencia y autores en openlab_info.json y en Zenodo 10782663.
          files: out/*
