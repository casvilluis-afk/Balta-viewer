# OpenBridgeLAB (TU Dresden, DOI 10.25532/OPARA-1548, CC BY-NC-SA 4.0): exploración remota de los zip y extracción de registros para probar PuenteGemelo.
name: Datos OpenBridgeLAB
on:
  workflow_dispatch:
    inputs:
      modo: { description: 'explorar | extraer | procesar', default: 'explorar' }
      n: { description: 'Mediciones por estado (procesar)', default: '8' }
      archivos: { description: 'zip::ruta;zip::ruta (modo extraer)', default: '' }
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests remotezip numpy scipy h5py
      - name: Procesar
        env: { MODO: '${{ github.event.inputs.modo }}', ARCH: '${{ github.event.inputs.archivos }}', NSEL: '${{ github.event.inputs.n }}' }
        run: |
          mkdir -p out
          python - <<'PY'
          import os, json, traceback, requests
          from remotezip import RemoteZip
          info = {}; API = 'https://opara.zih.tu-dresden.de/server/api/core/items/83bdfd26-ecae-452d-86a0-44d7e4958c33'
          try:
            it = requests.get(API, timeout=60).json(); info['titulo'] = it.get('name'); md = it.get('metadata', {})
            info['meta'] = {k: [x.get('value') for x in v] for k, v in md.items() if any(s in k for s in ('title', 'rights', 'description', 'identifier', 'contributor', 'date'))}
            bs = []
            for b in requests.get(API + '/bundles', timeout=60).json()['_embedded']['bundles']:
              for f in requests.get(b['_links']['bitstreams']['href'], timeout=60).json()['_embedded']['bitstreams']:
                bs.append({'bundle': b['name'], 'name': f['name'], 'size': f.get('sizeBytes'), 'url': f['_links']['content']['href']})
            info['bitstreams'] = bs
            urls = {f['name']: f['url'] for f in bs}
            if os.environ['MODO'] == 'explorar':
              for f in bs:
                if f['name'].lower().endswith('.pdf') and f['bundle'] == 'ORIGINAL': open('out/' + f['name'].replace(' ', '_'), 'wb').write(requests.get(f['url'], timeout=300).content)
                if f['name'].lower().endswith('.zip'):
                  try:
                    with RemoteZip(f['url']) as z:
                      L = z.infolist(); info.setdefault('zips', {})[f['name']] = {'n': len(L), 'primeros': [(x.filename, x.file_size) for x in L[:60]], 'tamanos': sorted({x.file_size for x in L})[:10]}
                  except Exception: info.setdefault('errores', []).append(f['name'] + ': ' + traceback.format_exc()[-800:])
            elif os.environ['MODO'] == 'procesar':
              import numpy as np, h5py, scipy.io
              from scipy.signal import decimate
              # sensores del modelo 2D (cuartos y centro de los vanos 1 y 2): promedio de las dos líneas y de dos posiciones vecinas (canal 12 excluido por la hoja de datos)
              SENS = {'S1_v1_25': [2, 3, 10, 11], 'S2_v1_50': [4, 5, 13], 'S3_v1_75': [6, 7, 14, 15], 'S4_v2_25': [26, 27, 18, 19], 'S5_v2_50': [28, 29, 20, 21], 'S6_v2_75': [30, 31, 22, 23]}
              NS = int(os.environ.get('NSEL') or 8); info['sensores'] = SENS; info['registros'] = []
              for zn in ['Reference_State.zip', 'Damage_State_1.zip', 'Damage_State_2.zip']:
                est = zn[:-4]
                with RemoteZip(urls[zn]) as z:
                  L = z.infolist(); h5s = sorted([x.filename for x in L if x.filename.endswith('.h5')]); mats = [x.filename for x in L if x.filename.endswith('.mat')]
                  info.setdefault('listas', {})[est] = {'h5': len(h5s), 'mat': mats}
                  cat = None
                  for m in mats:
                    try:
                      z.extract(m, 'cat'); fp = 'cat/' + m
                      try:
                        M = scipy.io.loadmat(fp, simplify_cells=True); cat = {k: v for k, v in M.items() if not k.startswith('__')}
                      except NotImplementedError:
                        with h5py.File(fp, 'r') as H: cat = {k: str(H[k]) for k in H.keys()}
                      info.setdefault('catalogo', {})[est] = json.loads(json.dumps(cat, default=lambda o: o.tolist() if hasattr(o, 'tolist') else str(o)))
                    except Exception: info.setdefault('errores', []).append(m + ': ' + traceback.format_exc()[-600:])
                  sel = [h5s[int(round(i))] for i in np.linspace(0, len(h5s) - 1, NS)]
                  for fn in sel:
                    try:
                      z.extract(fn, 'tmp'); fp = 'tmp/' + fn
                      with h5py.File(fp, 'r') as H:
                        d = H['RecBuff']; attrs = {k: (v.decode() if isinstance(v, bytes) else str(v)) for k, v in d.attrs.items()}; A = np.asarray(d[()], dtype=float)
                      if A.shape[0] < A.shape[1]: A = A.T
                      ch = {k: A[:, idx].mean(axis=1) for k, idx in SENS.items()}; X = np.column_stack(list(ch.values()))
                      Xd = decimate(X, 10, ftype='fir', axis=0, zero_phase=True); fs = 100.0
                      base = os.path.basename(fn)[:-3]; name = f'obl_{est}_{base}.csv'
                      with open('out/' + name, 'w') as fo:
                        fo.write(f'# OpenBridgeLAB (TU Dresden, Moeller et al., DOI 10.25532/OPARA-1548, CC BY-NC-SA 4.0). Estado {est}. Archivo {base}. 600 s, 1 kHz diezmado a 100 Hz. m/s2. Sensores: promedio de las dos lineas en los cuartos y centro de los vanos 1 y 2.\n')
                        fo.write('tiempo_s,' + ','.join(SENS.keys()) + '\n'); np.savetxt(fo, np.column_stack([np.arange(len(Xd)) / fs, Xd]), delimiter=',', fmt='%.6g')
                      info['registros'].append({'archivo': name, 'estado': est, 'h5': base, 'attrs': attrs, 'n': int(len(Xd)), 'rms': [float(v) for v in Xd.std(axis=0)]})
                      os.remove(fp)
                    except Exception: info.setdefault('errores', []).append(fn + ': ' + traceback.format_exc()[-800:])
            else:
              for spec in [s for s in os.environ['ARCH'].split(';') if s.strip()]:
                zn, path = spec.split('::'); 
                with RemoteZip(urls[zn]) as z: z.extract(path, 'out/raw')
          except Exception: info['error'] = traceback.format_exc()
          json.dump(info, open('out/obl_info.json', 'w'), indent=1, ensure_ascii=False, default=str)
          PY
          if [ -d out/raw ]; then cd out && zip -qr raw.zip raw && rm -rf raw; fi
      - if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: datos-openbridgelab
          name: Datos de prueba · OpenBridgeLAB (TU Dresden, CC BY-NC-SA 4.0)
          prerelease: true
          make_latest: false
          body: Extractos del conjunto OpenBridgeLAB (DOI 10.25532/OPARA-1548) para probar PuenteGemelo; uso no comercial, citar a los autores.
          files: out/*
