# Banco de nubes de puentes para probar la detección de geometría de PuenteGemelo.
# Fuentes abiertas (CC BY 4.0): Zenodo 18531104 (UAV LiDAR, 6 puentes de Corea, con etiquetas) y Zenodo 18738225 (Real 3D point clouds of bridges, TLS y MLS).
# Modos: zipcada (cada nube de un zip por separado) · explorar (lista el contenido de los zip de 18738225) · coreanos (6 puentes con etiquetas) · extraer (archivos elegidos de un zip de 18738225)
# · listar (contenido de un zip remoto: archivos = url) · zipurl (miembros de un zip remoto: url|miembro;...) · url (descarga directa: nombre|url;...).
# Otras fuentes usadas: ArchScanLib, U. de Cambridge (doi 10.17863/CAM.114586, CC BY 4.0); Tram bridge Schipluiden, TU Delft (doi 10.4121/13626368, CC BY-NC 4.0).
name: Banco de nubes
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'explorar | coreanos | extraer | listar | zipurl | zipcada | url | leer | ahn'
        default: 'explorar'
      archivos:
        description: 'coreanos: nombres separados por ; · extraer: zip|miembro;zip|miembro'
        default: ''
permissions:
  contents: write
jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy plyfile matplotlib remotezip laspy lazrs pye57 pandas pyproj
      - name: Procesar
        env: { MODO: '${{ github.event.inputs.modo }}', ARCH: '${{ github.event.inputs.archivos }}' }
        run: |
          mkdir -p out
          python - <<'PY' || true
          import os, json, urllib.parse, urllib.request, traceback, numpy as np
          from plyfile import PlyData, PlyElement
          import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt
          modo = os.environ['MODO'].strip(); info = {'modo': modo, 'items': {}, 'errores': []}
          Z2 = 'https://zenodo.org/records/18738225/files/'
          def guardar(base, xyz, lab=None, extra=None):
              n = len(xyz); rng = np.random.default_rng(1); keep = rng.choice(n, size=min(n, 1500000), replace=False); keep.sort()
              sub = xyz[keep]; off = sub.mean(axis=0); sub = (sub - off).astype(np.float32)
              el = PlyElement.describe(np.core.records.fromarrays([sub[:, 0], sub[:, 1], sub[:, 2]], names='x,y,z', formats='f4,f4,f4'), 'vertex')
              PlyData([el], text=False).write(f'out/{base}.ply')
              d = {'puntos_originales': int(n), 'puntos': int(len(sub)), 'extension_m': (sub.max(0) - sub.min(0)).round(2).tolist(), 'offset': off.round(3).tolist()}
              if lab is not None:
                  l = np.asarray(lab)[keep].astype(np.uint8); l.tofile(f'out/{base}_etiquetas.u8')
                  d['clases'] = {str(int(k)): int(c) for k, c in zip(*np.unique(l, return_counts=True))}
              if extra: d.update(extra)
              s = sub[rng.choice(len(sub), size=min(len(sub), 250000), replace=False)]; ext = s.max(0) - s.min(0); i = np.argsort(ext[:2])[::-1]
              fig, ax = plt.subplots(2, 1, figsize=(14, 8)); ax[0].scatter(s[:, i[0]], s[:, 2], s=.04, c='k'); ax[0].set_aspect('equal'); ax[0].set_title(base + ' · elevación (x/y vs z)')
              ax[1].scatter(s[:, 0], s[:, 1], s=.04, c='k'); ax[1].set_aspect('equal'); ax[1].set_title('planta'); fig.savefig(f'out/{base}.png', dpi=100); plt.close(fig)
              info['items'][base] = d; print(base, json.dumps(d), flush=True)
          def leer(path):
              p = path.lower()
              if p.endswith('.ply'):
                  pd = PlyData.read(path); v = next(e for e in pd.elements if all(k in [q.name for q in e.properties] for k in ('x', 'y', 'z'))); props = [q.name for q in v.properties]
                  els = {e.name: [[q.name, str(q.val_dtype)] for q in e.properties] + [len(e.data)] for e in pd.elements}
                  lab = next((q for q in props if any(t in q.lower() for t in ('label', 'class', 'semantic', 'scalar'))), None); L = np.asarray(v[lab]) if lab else None
                  if L is None:
                      # etiquetas en otro elemento con el mismo número de puntos
                      cands = [e for e in pd.elements if e is not v and len(e.data) == len(v.data) and len(e.properties) >= 1]
                      cands.sort(key=lambda e: 0 if any(t in (e.name + ' '.join(q.name for q in e.properties)).lower() for t in ('label', 'class', 'semantic')) else 1)
                      for e in cands:
                          if any(t in (e.name + ' '.join(q.name for q in e.properties)).lower() for t in ('label', 'class', 'semantic')):
                              q = next((q.name for q in e.properties if any(t in q.name.lower() for t in ('label', 'class', 'semantic'))), e.properties[0].name); L = np.asarray(e[q]); lab = e.name + '.' + q; break
                  return np.vstack([v['x'], v['y'], v['z']]).T.astype(np.float64), L, {'propiedades': props, 'etiqueta': lab, 'elementos': els}
              if p.endswith('.las') or p.endswith('.laz'):
                  import laspy; f = laspy.read(path); dims = list(f.point_format.dimension_names); L = None; lab = None
                  for nm in [d for d in dims if any(t in d.lower() for t in ('label', 'semantic'))] + ['classification', 'user_data', 'point_source_id']:
                      if nm in dims:
                          a = np.asarray(f[nm])
                          if len(np.unique(a[:200000])) > 1: L = a; lab = nm; break
                  return np.vstack([f.x, f.y, f.z]).T, L, {'formato': 'las', 'dimensiones': dims, 'etiqueta': lab}
              if p.endswith('.e57'):
                  import pye57; e = pye57.E57(path); xs = []
                  for k in range(e.scan_count):
                      d = e.read_scan(k, ignore_missing_fields=True, transform=True); xs.append(np.vstack([d['cartesianX'], d['cartesianY'], d['cartesianZ']]).T)
                  return np.vstack(xs), None, {'formato': 'e57', 'escaneos': int(e.scan_count)}
              import pandas as pd
              sk = 1 if p.endswith('.pts') else 0
              a = pd.read_csv(path, sep=',' if p.endswith('.csv') else r'\s+', header=None, skiprows=sk, nrows=60000000, usecols=[0, 1, 2], dtype=np.float64, on_bad_lines='skip').to_numpy()
              return a[:, :3], None, {'formato': 'texto'}
          import zipfile, shutil
          PUNTOS = ('.ply', '.las', '.laz', '.e57', '.pts', '.xyz', '.txt', '.csv')
          def desde_zip(f, base, extra):
              # zip local: se listan sus archivos; los de nubes de puntos se leen y se juntan en una sola nube (registradas en el mismo sistema)
              with zipfile.ZipFile(f) as z:
                  L = [[q.filename, q.file_size] for q in z.infolist()]; info['items'][base + '_contenido'] = L
                  pts = [q for q, sz in L if q.lower().endswith(PUNTOS) and sz > 1000]
                  for q, sz in L:
                      if q.lower().endswith(('.pdf', '.md', '.json')) and sz < 5e6: z.extract(q, 'tmpz'); shutil.copy(os.path.join('tmpz', q), 'out/' + base + '_' + os.path.basename(q).replace(' ', '_'))
                  xs = []; ex = dict(extra); ex['archivos'] = pts
                  for q in pts[:12]:
                      z.extract(q, 'tmpz'); x, _, e = leer(os.path.join('tmpz', q)); xs.append(x); ex.setdefault('formatos', []).append(e); os.remove(os.path.join('tmpz', q))
                  if xs: guardar(base, np.vstack(xs), None, ex)
          try:
              if modo == 'explorar':
                  from remotezip import RemoteZip
                  for z in ['tls_dataset.zip', 'mls_data.zip']:
                      with RemoteZip(Z2 + z + '?download=1') as rz:
                          info['items'][z] = [[m.filename, m.file_size, m.compress_size] for m in rz.infolist()]
              elif modo == 'coreanos':
                  for name in [p.strip() for p in os.environ['ARCH'].split(';') if p.strip()]:
                      try:
                          url = 'https://zenodo.org/records/18531104/files/' + urllib.parse.quote(name) + '?download=1'
                          print('Descargando', url, flush=True); urllib.request.urlretrieve(url, 'tmp.ply')
                          xyz, lab, ex = leer('tmp.ply'); guardar(name.replace(' Bridge_annotation.ply', '').replace(' ', '_'), xyz, lab, ex); os.remove('tmp.ply')
                      except Exception as e: info['errores'].append([name, repr(e), traceback.format_exc()[-1500:]])
              elif modo == 'extraer':
                  from remotezip import RemoteZip
                  for it in [p.strip() for p in os.environ['ARCH'].split(';') if p.strip()]:
                      try:
                          z, m = it.split('|', 1)
                          with RemoteZip(Z2 + z + '?download=1') as rz: rz.extract(m, 'tmpx')
                          base = os.path.splitext(os.path.basename(m))[0].replace(' ', '_')
                          xyz, lab, ex = leer(os.path.join('tmpx', m)); ex['zip'] = z; ex['miembro'] = m; ex['nombre_elemento'] = 'auto'; guardar(base, xyz, lab, ex)
                          os.remove(os.path.join('tmpx', m))
                      except Exception as e: info['errores'].append([it, repr(e), traceback.format_exc()[-1500:]])
              elif modo == 'listar':
                  from remotezip import RemoteZip
                  for u in [p.strip() for p in os.environ['ARCH'].split(';') if p.strip()]:
                      with RemoteZip(u) as rz: info['items'][u] = [[m.filename, m.file_size, m.compress_size] for m in rz.infolist()]
              elif modo == 'zipurl':
                  from remotezip import RemoteZip
                  for it in [p.strip() for p in os.environ['ARCH'].split(';') if p.strip()]:
                      try:
                          u, m = it.split('|', 1)
                          with RemoteZip(u) as rz: rz.extract(m, 'tmpx')
                          f = os.path.join('tmpx', m); base = os.path.splitext(os.path.basename(m))[0].replace(' ', '_')
                          if f.lower().endswith('.zip'): desde_zip(f, base, {'url': u, 'miembro': m})
                          elif f.lower().endswith(PUNTOS): xyz, lab, ex = leer(f); ex['url'] = u; ex['miembro'] = m; guardar(base, xyz, lab, ex)
                          else: shutil.copy(f, 'out/' + os.path.basename(f).replace(' ', '_'))
                          os.remove(f)
                      except Exception as e: info['errores'].append([it, repr(e), traceback.format_exc()[-1500:]])
              elif modo == 'zipcada':
                  # ARCH = URL del zip | filtro opcional (texto que debe contener el nombre) | máximo de nubes
                  u, *rest = [x.strip() for x in os.environ['ARCH'].split('|')]; filt = rest[0] if rest else ''; mx = int(rest[1]) if len(rest) > 1 else 40
                  urllib.request.urlretrieve(u, 'z.zip')
                  with zipfile.ZipFile('z.zip') as z:
                      L = [[q.filename, q.file_size] for q in z.infolist()]; info['items']['_contenido'] = L
                      pts = [q for q, sz in L if q.lower().endswith(PUNTOS) and sz > 1000 and filt in q][:mx]
                      for q in pts:
                          try:
                              z.extract(q, 'tmpz'); xyz, lab, ex = leer(os.path.join('tmpz', q)); ex['miembro'] = q; os.remove(os.path.join('tmpz', q))
                              guardar(os.path.splitext(os.path.basename(q))[0], xyz, lab, ex)
                          except Exception as e: info['errores'].append([q, repr(e), traceback.format_exc()])
              elif modo == 'leer':
                  # descarga páginas o índices (texto) para consultarlos: URL;URL;...
                  for k, u in enumerate([x.strip() for x in os.environ['ARCH'].split(';') if x.strip()]):
                      try:
                          req = urllib.request.Request(u, headers={'User-Agent': 'PuenteGemelo-banco'}); data = urllib.request.urlopen(req, timeout=120).read()
                          open(f'out/leer_{k}.txt', 'wb').write(data); info['items'][u] = len(data)
                      except Exception as e: info['errores'].append([u, repr(e)])
              elif modo == 'ahn':
                  # recorte de AHN4 (dominio público) alrededor de un punto: nombre|lat|lon|radio_m|subhojas (p. ej. 39CZ1_07,39CZ1_08)
                  import pyproj; tr = pyproj.Transformer.from_crs(4326, 28992, always_xy=True)
                  for it in [x.strip() for x in os.environ['ARCH'].split(';') if x.strip()]:
                      try:
                          nm, lat, lon, rad, tiles = it.split('|'); x0, y0 = tr.transform(float(lon), float(lat)); rad = float(rad); xs = []; ls = []
                          for t in tiles.split(','):
                              u = f'https://geotiles.citg.tudelft.nl/AHN4_T/{t.strip()}.LAZ'; print('Descargando', u, flush=True); urllib.request.urlretrieve(u, 'tile.laz')
                              import laspy; f = laspy.read('tile.laz'); X = np.vstack([f.x, f.y, f.z]).T; m = (np.abs(X[:, 0] - x0) <= rad) & (np.abs(X[:, 1] - y0) <= rad)
                              xs.append(X[m]); ls.append(np.asarray(f.classification)[m]); info['items'][nm + '_' + t] = {'puntos_hoja': int(len(X)), 'en_recorte': int(m.sum()), 'x_rango': [float(X[:, 0].min()), float(X[:, 0].max())], 'y_rango': [float(X[:, 1].min()), float(X[:, 1].max())]}
                          X = np.vstack(xs); L = np.concatenate(ls); ex = {'fuente': 'AHN4 (dominio público) vía geotiles.citg.tudelft.nl', 'centro_rd': [x0, y0], 'radio_m': rad}
                          B = X[L == 26]
                          if len(B) > 1000:  # franja a lo largo del eje de la obra (clase 26), a densidad completa
                              c = B[:, :2].mean(0); _, _, vt = np.linalg.svd(B[:, :2] - c, full_matrices=False); ax = vt[0]; nr = np.array([-ax[1], ax[0]])
                              sb = (B[:, :2] - c) @ ax; tb = (B[:, :2] - c) @ nr; s0, s1 = np.percentile(sb, [.5, 99.5]); tm = np.median(tb)
                              sa = (X[:, :2] - c) @ ax; ta = (X[:, :2] - c) @ nr; m = (sa >= s0 - 30) & (sa <= s1 + 30) & (np.abs(ta - tm) <= 25)
                              X = X[m]; L = L[m]; ex.update({'franja': 'eje por clase 26, ±25 m', 'largo_clase26_m': float(s1 - s0), 'eje_rd': [float(ax[0]), float(ax[1])]})
                          guardar(nm, X, L, ex)
                      except Exception as e: info['errores'].append([it, repr(e), traceback.format_exc()[-1500:]])
              elif modo == 'url':
                  for it in [p.strip() for p in os.environ['ARCH'].split(';') if p.strip()]:
                      try:
                          nm, u = it.split('|', 1); print('Descargando', u, flush=True); urllib.request.urlretrieve(u, nm)
                          if nm.lower().endswith('.zip'): desde_zip(nm, os.path.splitext(nm)[0], {'url': u})
                          else: xyz, lab, ex = leer(nm); ex['url'] = u; guardar(os.path.splitext(nm)[0], xyz, lab, ex)
                          os.remove(nm)
                      except Exception as e: info['errores'].append([it, repr(e), traceback.format_exc()[-1500:]])
          except Exception as e: info['errores'].append(['general', repr(e), traceback.format_exc()[-2000:]])
          json.dump(info, open(f'out/info_{modo}_' + os.environ.get('GITHUB_RUN_ID', '0') + '.json', 'w'), indent=1)
          PY
          ls -la out
      - name: Publicar (pre-release de datos, no es la app)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: datos-banco-puentes
          name: Datos de prueba · banco de nubes de puentes (fuentes abiertas; ver cuerpo)
          prerelease: true
          make_latest: false
          body: Nubes reducidas a 1,5 M puntos para probar la detección de geometría de PuenteGemelo. Fuentes UAV LiDAR bridge point cloud dataset (Zenodo 18531104, CC BY 4.0), Real 3D point clouds of bridges (Zenodo 18738225, CC BY 4.0), ArchScanLib (U. de Cambridge, doi 10.17863/CAM.114586, CC BY 4.0) y Tram bridge Schipluiden (TU Delft, doi 10.4121/13626368, CC BY-NC 4.0); citar a sus autores.
          files: out/*
